name: Build macOS Binary

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # 支持手动点击按钮触发

env:
  BUILD_TYPE: Release

jobs:
  build-macos:
    # macos-15 为 Apple Silicon (M 系列 ARM64)，如需 Intel 可替换为 macos-13
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            openssl@3 \
            libplist \
            glib \
            gstreamer \
            gst-plugins-base \
            gst-plugins-good \
            gst-libav \
            orc \
            dylibbundler

      - name: Set OpenSSL Environment
        run: |
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DNO_X11_DEPS=ON

      - name: Build binary
        run: |
          cmake --build build --parallel --config ${{ env.BUILD_TYPE }}

      - name: Verify build output
        run: |
          test -x build/uxplay
          ls -la build/uxplay
          file build/uxplay

      - name: Package bundle with dylibs
        run: |
          mkdir -p dist/bin dist/lib
          cp build/uxplay dist/bin/
          
          # 自动收集该二进制引用的 Homebrew 动态链接库并修复 rpath
          dylibbundler -b -x dist/bin/uxplay -d dist/lib/ -p "@executable_path/../lib" -of || true
          
          # 打包为压缩文件
          cd dist
          zip -r ../uxplay-macos-arm64.zip bin lib
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uxplay-macos-arm64
          path: uxplay-macos-arm64.zip
          retention-days: 30
