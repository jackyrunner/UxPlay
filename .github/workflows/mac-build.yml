name: Build macOS (Intel & Universal)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-macos-intel:
    # macos-13 是 GitHub 提供的纯 Intel (x86_64) Runner 环境
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            openssl@3 \
            libplist \
            glib \
            gstreamer \
            gst-plugins-base \
            gst-plugins-good \
            gst-libav \
            orc

      - name: Set OpenSSL Environment
        run: |
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DNO_X11_DEPS=ON

      - name: Build binary
        run: |
          cmake --build build --parallel --config ${{ env.BUILD_TYPE }}

      - name: Verify binary architecture
        run: |
          test -x build/uxplay
          ls -la build/uxplay
          # 输出架构信息，确保为 x86_64
          file build/uxplay

      - name: Package binary
        run: |
          mkdir -p dist/bin
          cp build/uxplay dist/bin/
          cd dist
          zip -r ../uxplay-macos-intel-x86_64.zip bin
          cd ..

      - name: Upload Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uxplay-macos-intel-x86_64
          path: uxplay-macos-intel-x86_64.zip
          retention-days: 30
